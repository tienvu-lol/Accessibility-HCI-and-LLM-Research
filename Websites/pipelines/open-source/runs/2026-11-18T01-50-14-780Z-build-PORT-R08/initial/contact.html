  <main id="main-content" data-section="main">
    <h1>Contact</h1>
    <p>Get in touch with me for collaborations, speaking inquiries, or just to say hello.</p>

    <form id="contact-form" data-component="contact-form" novalidate>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </div>
      <button type="submit" class="cta primary">Send Message</button>
    </form>
  </main>
