  <script>
    // Inline dataset for JavaScript reference
    const javascriptData = [
      {topic: "let & const", summary: "Block‑scoped variable declarations.", snippet: "let x = 1;\nconst y = 2;"},
      {topic: "Arrow functions", summary: "Concise syntax with lexical this.", snippet: "const add = (a, b) => a + b;"},
      {topic: "Template literals", summary: "String interpolation and multi‑line strings.", snippet: `const msg = \`Hello, ${name}!\`;`},
      {topic: "Destructuring", summary: "Unpack values from arrays or objects.", snippet: "const [a, b] = [1, 2];\nconst {x, y} = {x:10, y:20};"},
      {topic: "Default parameters", summary: "Function parameters with default values.", snippet: "function greet(name = 'Guest') { return `Hi ${name}`; }"},
      {topic: "Rest & spread", summary: "Collect arguments or expand iterables.", snippet: "function sum(...nums) { return nums.reduce((a,b)=>a+b,0); }\nconst copy = [...arr];"},
      {topic: "Modules (ESM)", summary: "Export and import bindings between files.", snippet: "export function foo(){};\nimport {foo} from './foo.js';"},
      {topic: "Promises", summary: "Asynchronous operation placeholder.", snippet: "fetch('/data').then(r=>r.json()).then(d=>console.log(d));"},
      {topic: "Async/await", summary: "Syntactic sugar over promises.", snippet: "async function load() { const resp = await fetch('/data'); const data = await resp.json(); return data; }"},
      {topic: "Map & Set", summary: "Key‑value collections and unique value sets.", snippet: "const m = new Map(); m.set('key','val');\nconst s = new Set([1,2,2,3]); // {1,2,3}"},
      {topic: "Classes", summary: "Syntactic sugar over prototype‑based inheritance.", snippet: "class Rectangle { constructor(w,h){this.w=w;this.h=h;} area(){return this.w*this.h;}}"},
      {topic: "Optional chaining", summary: "Safe property access.", snippet: "const zip = user?.address?.zipcode;"}
    ];

    function renderJS(container, items) {
      container.innerHTML = '';
      if (items.length === 0) {
        const msg = document.createElement('p');
        msg.textContent = 'No reference items.';
        container.appendChild(msg);
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'card-grid';
      items.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.component = 'project-card';
        card.dataset.instance = Math.random().toString(36).substr(2,9);
        // Escape HTML in snippet for display
        const escapedSnippet = item.snippet.replace(/[&<>"']/g, tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        }[tag]));
        card.innerHTML = `
          <img src="assets/placeholder.svg" alt="${item.topic} thumbnail">
          <div class="card-body">
            <h3>${item.topic}</h3>
            <p>${item.summary}</p>
            <pre><code>${escapedSnippet}</code></pre>
          </div>
        `;
        grid.appendChild(card);
      });
      container.appendChild(grid);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('js-container');
      if (typeof renderJS === 'function') {
        renderJS(container, javascriptData);
      }
    });
  </script>

  <script src="js/main.js"></script>
