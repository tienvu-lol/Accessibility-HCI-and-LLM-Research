<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign In – WeatherWise</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header data-section="header" data-component="site-header">
    <h1>WeatherWise</h1>
  </header>

  <nav data-section="navigation" data-component="primary-nav" aria-label="Primary">
    <ul>
      <li><a href="index.html" data-instance="home-link">Home</a></li>
      <li><a href="today.html" data-instance="today-link">Today</a></li>
      <li><a href="hourly.html" data-instance="hourly-link">Hourly</a></li>
      <li><a href="tenday.html" data-instance="10day-link">10‑Day</a></li>
      <li><a href="monthly.html" data-instance="monthly-link">Monthly</a></li>
      <li><a href="allergy.html" data-instance="allergy-link">Allergies</a></li>
      <li><a href="radar.html" data-instance="radar-link">Radar</a></li>
      <li><a href="news.html" data-instance="news-link">News</a></li>
      <li><a href="login.html" data-instance="login-link" aria-current="page">Sign In</a></li>
    </ul>
  </nav>

  <main id="main-content" data-section="main">
    <section data-component="login-form" aria-label="Sign in form">
      <h2>Sign in to your account</h2>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email address</label>
          <input type="email" id="login-email" name="email" required aria-required="true">
          <div class="error-message" id="email-error" aria-live="polite"></div>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" name="password" required aria-required="true">
          <div class="error-message" id="password-error" aria-live="polite"></div>
        </div>
        <button type="submit">Sign in</button>
      </form>
    </section>
  </main>

  <footer data-section="footer" data-component="site-footer">
    <p>&copy; 2026 WeatherWise. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
