<!doctype html>
<html lang="en" data-section="contact">
<head>
  <meta charset="utf-8">
  <title>Civic Harbor – File a Complaint (Demo)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" data-component="site-header">
    <img src="assets/logo.svg" alt="Civic Harbor logo" class="logo">
    <div data-component="language-switcher">
      <button type="button" aria-label="Toggle language">Español</button>
    </div>
  </header>

  <nav class="primary-nav" aria-label="Main navigation" data-component="primary-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="parks-and-recreation.html">Parks & Recreation</a></li>
      <li><a href="pothole-repair.html">Pothole Repair</a></li>
      <li><a href="pay-bill.html">Pay Your Bill</a></li>
      <li><a href="complaint-form.html">File a Complaint</a></li>
    </ul>
  </nav>

  <main id="main-content" data-component="main-content">
    <h1>File a Complaint (Demo)</h1>

    <div class="error-summary" role="alert" aria-live="assertive" style="display:none;"></div>

    <form data-demo="true" aria-labelledby="complaint-form-title">
      <label for="complaint-name">Your Name</label>
      <input type="text" id="complaint-name" name="complaint-name" required>

      <label for="complaint-email">Your Email</label>
      <input type="email" id="complaint-email" name="complaint-email" required>

      <label for="complaint-category">Category</label>
      <select id="complaint-category" name="complaint-category" required>
        <!-- Options populated by JS -->
      </select>

      <label for="complaint-description">Description</label>
      <textarea id="complaint-description" name="complaint-description" rows="5" required></textarea>

      <button type="submit">Submit Complaint</button>
    </form>

    <aside class="sidebar" data-component="sidebar">
      <h2>Helpful Links</h2>
      <ul>
        <li><a href="pay-bill.html">Pay Your Bill</a></li>
        <li><a href="pothole-repair.html">Pothole Repair</a></li>
      </ul>
    </aside>
  </main>

  <footer class="site-footer" data-component="site-footer">
    <p>&copy; 2024 Civic Harbor. All rights reserved.</p>
  </footer>
</body>
</html>
