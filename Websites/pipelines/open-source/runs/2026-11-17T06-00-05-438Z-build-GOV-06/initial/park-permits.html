    <h1>Park Use Permit Application (Demo)</h1>

    <div class="error-summary" role="alert" aria-live="assertive" style="display:none;"></div>

    <form data-demo="true" aria-labelledby="permit-form-title">
      <label for="applicant-name">Name</label>
      <input type="text" id="applicant-name" name="applicant-name" required>

      <label for="applicant-email">Email</label>
      <input type="email" id="applicant-email" name="applicant-email" required>

      <label for="permit-type">Permit Type</label>
      <select id="permit-type" name="permit-type" required>
        <!-- Options populated by JS -->
      </select>

      <label for="event-date">Event Date</label>
      <input type="date" id="event-date" name="event-date" required>

      <button type="submit">Submit Application</button>
    </form>
