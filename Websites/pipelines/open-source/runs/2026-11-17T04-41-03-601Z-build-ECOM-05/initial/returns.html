  <header class="site-header" data-component="site-header">
    <a href="index.html" class="logo">Summit & Stone</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">
      Menu
    </button>
    <nav id="primary-nav" class="primary-nav" data-component="primary-nav">

        <li><a href="shop-womens.html">Women</a></li>

      </ul>
    </nav>
  </header>

  <main id="main-content" data-section="returns">
    <section class="returns-info">
      <h1>Returns & Repairs</h1>
      <p>We want you to be happy with your purchase. If you're not, we'll make it right.</p>
      
      <form class="returns-form" data-component="contact-form">
        <fieldset>
          <legend>Return Request</legend>
          <div class="form-group">
            <label for="order-number">Order Number</label>
            <input type="text" id="order-number" name="order-number" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="reason">Reason for Return</label>
            <select id="reason" name="reason" required>
              <option value="">Select a reason</option>
              <option value="defective">Defective</option>
              <option value="wrong-size">Wrong Size</option>
              <option value="not-as-described">Not as Described</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-group">
            <label for="message">Additional Comments</label>
            <textarea id="message" name="message" rows="4"></textarea>
          </div>
          <button type="submit" class="cta-button">Submit Return Request</button>
        </fieldset>
      </form>
    </section>
  </main>
