  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <header class="site-header" data-component="site-header">
    <a href="index.html" class="logo">Summit & Stone</a>
    <button class="nav-toggle" aria-expanded="false" aria-controls="primary-nav">
      Menu
    </button>
    <nav id="primary-nav" class="primary-nav" data-component="primary-nav">
      <ul>
        <li><a href="shop-womens.html">Women</a></li>

      </ul>
    </nav>
  </header>

  <main id="main-content" data-section="account">
    <section class="account-form">
      <h1>Create an Account</h1>
      <form class="registration-form" data-component="contact-form">
        <fieldset>
          <legend>Sign Up</legend>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
          </div>
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="8">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" required>
          </div>
          <button type="submit" class="cta-button">Register</button>
        </fieldset>
      </form>
    </section>
  </main>

  <footer class="site-footer" data-component="site-footer">
