<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WeatherNow – Hourly Forecast for Ashburn, VA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  <header data-section="header" data-component="site-header">
    <div class="demo-premium-banner" aria-label="Demo Premium – Not functional" style="background:#ffeb3b;color:#222;padding:.5rem;text-align:center;font-size:.875rem;">
      Demo Premium – Not functional
    </div>
    <h1>WeatherNow</h1>
    <form class="location-search" data-component="location-search">
      <label for="location-input-hourly" class="visually-hidden">Location search</label>
      <input type="text" id="location-input-hourly" placeholder="Enter location (e.g., Ashburn, VA)" aria-label="Location search">
      <button type="button">Search</button>
    </form>
  </header>
  <nav data-section="navigation" data-component="primary-nav">
    <ul class="nav-list">
      <li><a href="index.html">Home</a></li>
      <li><a href="today.html">Today</a></li>
      <li><a href="radar.html">Radar</a></li>
      <li><a href="news.html">News</a></li>
      <li><a href="login.html">Login</a></li>
      <li><a href="hourly.html" aria-current="page">Hourly</a></li>
      <li><a href="tenday.html">10‑Day</a></li>
      <li><a href="monthly.html">Monthly</a></li>
      <li><a href="allergy.html">Allergies</a></li>
    </ul>
  </nav>
  <main id="main-content" data-section="main" class="main-content">
    <section data-section="hourly-forecast" data-component="hero">
      <h2>Hourly Forecast</h2>
      <div id="hourly-container">Loading&hellip;</div>
      <button id="unit-toggle-hourly" aria-pressed="false">°C</button>
    </section>

    <section data-section="alerts" data-component="alert-filters">
      <h3>Alert Filters</h3>
      <div class="alert-filter-group">
        <label><input type="checkbox" class="alert-filter" value="thunderstorm"> Thunderstorm</label>
        <label><input type="checkbox" class="alert-filter" value="flood"> Flood</label>
        <label><input type="checkbox" class="alert-filter" value="heat"> Heat</label>
        <label><input type="checkbox" class="alert-filter" value="winter"> Winter</label>
      </div>
      <div id="demo-alert-banner" role="alert" aria-live="assertive" style="display:none;background:#ffeb3b;color:#222;padding:1rem;margin-top:1rem;">
        <strong>Demo Alert:</strong> Selected conditions are active. <button id="close-alert-banner">Close</button>
      </div>
    </section>
  </main>
  <footer data-section="footer" data-component="site-footer">
    &copy; 2026 WeatherNow. All rights reserved. <a href="help.html">Help</a> | <a href="about.html">About</a>
  </footer>
  <script>
    // Reuse the same hourly data from today.html for demo consistency
    const hourlyData = [
      {time: "00:00", tempF: 58, condition: "Clear", precip: 0},
      {time: "01:00", tempF: 57, condition: "Clear", precip: 0},
      {time: "02:00", tempF: 56, condition: "Clear", precip: 0},
      {time: "03:00", tempF: 55, condition: "Clear", precip: 0},
      {time: "04:00", tempF: 55, condition: "Clear", precip: 0},
      {time: "05:00", tempF: 56, condition: "Clear", precip: 0},
      {time: "06:00", tempF: 58, condition: "Mostly Clear", precip: 0},
      {time: "07:00", tempF: 62, condition: "Mostly Sunny", precip: 0},
      {time: "08:00", tempF: 66, condition: "Mostly Sunny", precip: 0},
      {time: "09:00", tempF: 69, condition: "Partly Cloudy", precip: 0},
      {time: "10:00", tempF: 71, condition: "Partly Cloudy", precip: 0},
      {time: "11:00", tempF: 72, condition: "Partly Cloudy", precip: 0},
      {time: "12:00", tempF: 72, condition: "Partly Cloudy", precip: 0},
      {time: "13:00", tempF: 71, condition: "Partly Cloudy", precip: 0},
      {time: "14:00", tempF: 70, condition: "Partly Cloudy", precip: 0},
      {time: "15:00", tempF: 69, condition: "Partly Cloudy", precip: 0},
      {time: "16:00", tempF: 68, condition: "Partly Cloudy", precip: 0},
      {time: "17:00", tempF: 66, condition: "Partly Cloudy", precip: 0},
      {time: "18:00", tempF: 64, condition: "Partly Cloudy", precip: 0},
      {time: "19:00", tempF: 62, condition: "Partly Cloudy", precip: 0},
      {time: "20:00", tempF: 60, condition: "Clear", precip: 0},
      {time: "21:00", tempF: 59, condition: "Clear", precip: 0},
      {time: "22:00", tempF: 58, condition: "Clear", precip: 0},
      {time: "23:00", tempF: 57, condition: "Clear", precip: 0}
    ];

    function renderHourly() {
      const container = document.getElementById('hourly-container');
      container.innerHTML = '';
      hourlyData.forEach(h => {
        const div = document.createElement('div');
        div.style.display = 'inline-block';
        div.style.minWidth = '60px';
        div.style.textAlign = 'center';
        div.style.margin = '0.5rem';
        div.style.padding = '0.5rem';
        div.style.border = '1px solid #ccc';
        div.style.borderRadius = '0.25rem';
        div.innerHTML = `<strong>${h.time}</strong><br>${h.tempF}°<br>${h.condition}<br>${h.precip}%`;
        container.appendChild(div);
      });
    }

    // Unit toggle demo
    const unitBtn = document.getElementById('unit-toggle-hourly');
    let isC = false;
    unitBtn.addEventListener('click', () => {
      isC = !isC;
      unitBtn.textContent = isC ? '°F' : '°C';
      unitBtn.setAttribute('aria-pressed', isC);
      // For demo, we just toggle label; actual conversion would happen here.
    });

    // Location search demo
    const searchForm = document.querySelector('.location-search form');
    if (searchForm) {
      searchForm.addEventListener('submit', e => {
        e.preventDefault();
        const input = searchForm.querySelector('input');
        const val = input.value.trim();
        if (val) {
          alert(`Demo: showing forecast for "${val}". (No real data)`);
          input.value = '';
        }
      });
    }

    // Alert filters demo
    const alertCheckboxes = document.querySelectorAll('.alert-filter input[type="checkbox"]');
    const alertBanner = document.getElementById('demo-alert-banner');
    if (alertCheckboxes.length && alertBanner) {
      alertCheckboxes.forEach(cb => {
        cb.addEventListener('change', () => {
          const anyChecked = Array.from(alertCheckboxes).some(c => c.checked);
          alertBanner.style.display = anyChecked ? 'block' : 'none';
        });
      });
    }
    const closeBanner = document.getElementById('close-alert-banner');
    if (closeBanner) {
      closeBanner.addEventListener('click', () => {
        document.getElementById('demo-alert-banner').style.display = 'none';
      });
    }

    // Initial render
    renderHourly();
  </script>
  <script src="js/main.js"></script>
</body>
</html>
