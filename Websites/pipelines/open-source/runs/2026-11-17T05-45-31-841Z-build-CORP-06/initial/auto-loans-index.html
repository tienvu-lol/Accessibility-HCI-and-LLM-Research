<!doctype html>
<html lang="en" data-section="page-auto-loans">
<head>
  <meta charset="utf-8">
  <title>Auto Loans – NovaBank</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header data-section="header" data-component="site-header">
    <h1 class="visually-hidden">NovaBank</h1>
    <img src="assets/logo.svg" alt="NovaBank logo" width="120">
    <nav data-component="primary-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="checking-index.html">Checking</a>
      <a href="savings-index.html">Savings</a>
      <a href="credit-cards-index.html">Credit Cards</a>
      <a href="mortgage-index.html">Mortgage</a>
      <a href="auto-loans-index.html">Auto Loans</a>
      <a href="help-index.html">Help</a>
      <a href="contact-us-index.html">Contact</a>
    </nav>
  </header>

  <section data-component="hero-banner" class="hero-banner">
    <h1>Auto Loans</h1>
    <p>Financing made easy for your next vehicle.</p>
  </section>

  <main id="main-content" data-section="main" data-component="content-band">
    <h2>Auto‑Loan Calculator (Demo)</h2>
    <form id="loan-calc-form" data-component="loan-calculator" novalidate>
      <label for="loan-amount">Loan Amount ($)</label>
      <input type="number" id="loan-amount" name="Amount" required>
      <label for="loan-term">Term (months)</label>
      <select id="loan-term" name="Term" required>
        <option value="">Select…</option>
        <option value="12">12</option>
        <option value="24">24</option>
        <option value="36">36</option>
        <option value="48">48</option>
        <option value="60">60</option>
      </select>
      <button type="submit">Calculate</button>
    </form>
    <p id="loan-result" aria-live="polite"></p>
  </main>

  <footer data-section="footer" data-component="site-footer">
    <p>&copy; 2024 NovaBank.</p>
  </footer>
</body>
</html>
