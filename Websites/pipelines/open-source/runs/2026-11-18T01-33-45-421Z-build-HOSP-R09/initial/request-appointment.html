<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request an Appointment</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link" id="skip-link">Skip to main content</a>
  <header>
    <h1>Request an Appointment</h1>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="request-appointment.html">Request an Appointment</a>
  </nav>
  <main id="main-content">
    <h2>Request an Appointment</h2>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name"><br><br>
      <label for="email">Email:</label>
      <input type="email" id="email" name="email"><br><br>
      <label for="phone">Phone:</label>
      <input type="tel" id="phone" name="phone"><br><br>
      <label for="appointment-date">Appointment Date:</label>
      <input type="date" id="appointment-date" name="appointment-date"><br><br>
      <input type="submit" value="Submit">
    </form>
  </main>
  <footer>
    <p>&copy; 2024 Healthcare Website</p>
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
