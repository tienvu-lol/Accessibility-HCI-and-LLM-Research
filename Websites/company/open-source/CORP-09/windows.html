<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Windows</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Microsoft Replica</h1>
  </header>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="microsoft-365.html">Microsoft 365</a></li>
      <li><a href="windows.html">Windows</a></li>
    </ul>
  </nav>
  <main id="main-content">
    <h2>Windows</h2>
    <p>Discover the latest version of Windows.</p>
    <button id="product-filters">Show Filters</button>
    <div id="product-filter-options" style="display: none;">
      <h3>Filter Options</h3>
      <ul>
        <li>Version: Windows 10</li>
        <li>Version: Windows 11</li>
      </ul>
    </div>
  </main>
  <footer>
    <p>&copy; 2024 Microsoft Replica</p>
  </footer>
  <script src="js/main.js"></script>
  <script>
    const productFilters = document.getElementById("product-filters");
    const productFilterOptions = document.getElementById("product-filter-options");
    productFilters.addEventListener("click", function() {
      if (productFilterOptions.style.display === "none") {
        productFilterOptions.style.display = "block";
      } else {
        productFilterOptions.style.display = "none";
      }
    });
  </script>
