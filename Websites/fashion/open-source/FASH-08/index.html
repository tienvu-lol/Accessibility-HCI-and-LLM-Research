      <form action="#" method="get" class="search-form" data-component="search-form" data-section="header">
        <label for="search-input" class="visually-hidden">Search articles</label>
        <input type="search" id="search-input" name="q" placeholder="Search…" aria-label="Search">
        <button type="submit" aria-label="Submit search">🔍</button>
      </form>
    </div>
    <nav data-section="navigation" data-component="primary-nav">
      <ul>
        <li><a href="index.html">Home</a></li>

      </ul>
    </nav>

  <main id="main-content" data-section="main">
    <h1 class="visually-hidden">Home</h1>
    <section class="hero-band" data-section="hero" data-component="hero-band">
      <img src="assets/hero1.svg" alt="Featured fashion editorial">

    <section class="content-band" data-section="content" data-component="content-band">
      <h2>Latest Stories</h2>
      <div class="card-grid" data-component="card-grid">

      </div>

      <h2>Trending Topics</h2>
      <div class="card-grid" data-component="card-grid">
        <!-- Dynamically filled by JS -->
      </div>
    </section>

    <section class="content-band" data-section="content" data-component="newsletter">
      <h2>Stay Updated</h2>
      <form class="newsletter-form" data-component="newsletter-form" aria-label="Subscribe to newsletter">
        <label for="newsletter-email" class="visually-hidden">Email address</label>
        <input type="email" id="newsletter-email" placeholder="you@example.com" required>
        <button type="submit">Subscribe</button>
      </form>
      <div class="toast" aria-live="polite"></div>
    </section>
