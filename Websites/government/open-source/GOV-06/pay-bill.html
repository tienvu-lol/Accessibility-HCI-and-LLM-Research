<!doctype html>
<html lang="en" data-section="payment">
<head>
  <meta charset="utf-8">
  <title>Civic Harbor – Pay Your Bill (Demo)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" data-component="site-header">
    <img src="assets/logo.svg" alt="Civic Harbor logo" class="logo">
    <div data-component="language-switcher">
      <button type="button">Español</button>
    </div>
  </header>

  <nav class="primary-nav" aria-label="Main navigation" data-component="primary-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="parks-and-recreation.html">Parks & Recreation</a></li>
      <li><a href="pothole-repair.html">Pothole Repair</a></li>
      <li><a href="pay-bill.html">Pay Your Bill</a></li>
      <li><a href="complaint-form.html">File a Complaint</a></li>
    </ul>
  </nav>

  <main id="main-content" data-component="main-content">
    <h1>Pay Your Utility Bill (Demo)</h1>

    <div class="error-summary" role="alert" aria-live="assertive" style="display:none;"></div>

    <form data-demo="true" aria-labelledby="payment-form-title">
      <label for="account-number">Account Number</label>
      <input type="text" id="account-number" name="account-number" required>

      <label for="payment-amount">Amount ($)</label>
      <input type="number" id="payment-amount" name="payment-amount" min="0" step="0.01" required>

      <label for="payment-method">Payment Method</label>
      <select id="payment-method" name="payment-method" required>
        <!-- Options populated by JS -->
      </select>

      <label for="payer-email">Email (for receipt)</label>
      <input type="email" id="payer-email" name="payer-email" required>

      <button type="submit">Submit Payment</button>
    </form>

    <aside class="sidebar" data-component="sidebar">
      <h2>Related Services</h2>
      <ul>
        <li><a href="complaint-form.html">Report a Problem</a></li>
        <li><a href="pothole-repair.html">Pothole Repair</a></li>
      </ul>
    </aside>
  </main>

  <footer class="site-footer" data-component="site-footer">
    <p>&copy; 2024 Civic Harbor. All rights reserved.</p>
  </footer>
</body>
</html>
