<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fictional Mart – Shop All Categories</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" data-section="header" data-component="site-header">
    <h1>Fictional Mart</h1>
    <nav class="primary-nav" data-section="navigation" data-component="primary-nav">
      <a href="index.html">Home</a>
      <a href="target-circle.html">Target Circle</a>
      <a href="gift-registry.html">Gift Registry</a>
      <a href="weekly-ad.html">Weekly Ad</a>
      <a href="store-locator.html">Store Locator</a>
      <a href="shop-all-categories.html" aria-current="page">Shop All Categories</a>
      <a href="top-deals.html">Top Deals</a>
      <button type="button" aria-label="Demo cart – no real cart" data-component="cart-link">Cart (demo)</button>
      <button type="button" aria-label="Demo account – no real account" data-component="account-link">Account (demo)</button>
    </nav>
  </header>

  <main id="main-content" class="content-band" data-section="main">
    <section class="hero" data-section="hero" data-component="hero">
      <h2>Shop All Categories</h2>
      <p>Browse our full product selection.</p>
    </section>

    <section data-section="filters" data-component="filter-controls">
      <h2 class="section-title">Filter & Sort</h2>
      <label>
        Category:
        <select id="filter-category" data-component="category-filter">
          <option value="all">All Categories</option>
          <option value="Produce">Produce</option>
          <option value="Dairy">Dairy</option>
          <option value="Bakery">Bakery</option>
          <option value="Meat">Meat</option>
          <option value="Pantry">Pantry</option>
          <option value="Spreads">Spreads</option>
          <option value="Beverages">Beverages</option>
          <option value="Snacks">Snacks</option>
        </select>
      </label>
      <label>
        Max Price ($):
        <input type="number" id="filter-max-price" placeholder="e.g. 10" min="0" step="0.01" data-component="price-filter">
      </label>
      <label>
        Sort by:
        <select id="sort-select" data-component="sort-select">
          <option value="name-asc">Name A‑Z</option>
          <option value="name-desc">Name Z‑A</option>
          <option value="price-asc">Price Low‑High</option>
          <option value="price-desc">Price High‑Low</option>
        </select>
      </label>
      <button id="reset-filters" data-component="reset-filters">Reset</button>
    </section>

    <section data-section="products" data-component="product-grid">
      <h2 class="section-title">Products</h2>
      <div id="product-grid" class="card-grid" data-component="product-grid"></div>
    </section>
  </main>

  <footer class="site-footer" data-section="footer" data-component="site-footer">
    &copy; 2027 Fictional Mart. All rights reserved.
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
