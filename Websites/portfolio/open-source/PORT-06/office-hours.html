<!doctype html>
<html lang="en" data-section="page-office-hours">
<head>
  <meta charset="utf-8">
  <title>Office Hours – Creative Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="js/main.js"></script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Header -->
  <header data-component="site-header" data-section="header">
    <nav data-component="primary-nav" aria-label="Main navigation" data-open="false">
      <a href="index.html" class="logo" aria-label="Home">
        <svg width="120" height="30" aria-hidden="true"><rect width="120" height="30" fill="#555"/></svg>
      </a>
      <button data-component="nav-toggle" aria-controls="primary-menu" aria-expanded="false" aria-label="Menu">
        ☰
      </button>
      <ul id="primary-menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="talks.html">Talks</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main id="main-content" data-section="content-band">
    <h1>Office Hours</h1>
    <table data-component="table" data-section="office-hours-table" border="1" cellpadding="4">
      <thead>
        <tr><th>Day</th><th>Time (UTC)</th></tr>
      </thead>
      <tbody id="office-hours-body"></tbody>
    </table>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tbody = document.getElementById('office-hours-body');
      window.sampleData.officeHoursSlots.forEach(slot => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${slot.day}</td><td>${slot.time}</td>`;
        tbody.appendChild(tr);
      });
    });
  </script>
