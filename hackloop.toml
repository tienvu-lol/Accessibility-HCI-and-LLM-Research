[project]
name = "repair-study"
check_commands = [
    "node --test Study/tools/*/*.test.js",
    "python -m unittest discover -s Study/tools -p test_*.py",
]

[runner]
cmd = "claude"
model = "sonnet"
reviewer_model = "sonnet"
max_turns = 30
max_budget_usd = 1.5

[guards]
lease_ttl_s = 900
heartbeat_s = 60
session_timeout_s = 1800
check_timeout_s = 900
net_timeout_s = 120
max_attempts = 3
max_reviews = 2
circuit_breaker = 5
quota_cooldown_start_s = 1800
quota_cooldown_max_s = 18000
longpoll_ms = 30000
sweep_ms = 1000
iface_watch_s = 30
rediscover_after_s = 180
scan_per_s = 20
drift_idle_s = 60

[run]
final_review = true
push_remote = false
main_branch = "study/hackloop-orchestration"
integration_branch = "integration"
smoke = ""
